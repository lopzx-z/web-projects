<!DOCTYPE html>
<html lang="pt-BR">

    <title>Meu jogo</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <main>
        <div id="sky">
            <div id="character">

                <!-- Cabeça -->
                <div id="character_header">

                    <div id="hair"></div>

                    <div id="eye">

                        <div class="eyes">
                            <div class="pupila"></div>
                        </div>

                        <div class="eyes">
                            <div class="pupila"></div>
                        </div>

                    </div>

                    <div id="area_mouth">

                </div>

                <div id="character_torso">
                    <div id="left_arm"></div>
                    <div id="torax"></div>
                    <div id="rigth_arm"></div>
                </div>

                <!-- Pernas -->
                <div id="character_legs">
                    <div id="legs_left"></div>
                    <div id="legs_right"></div>
                </div>

            </div>
        </div>
        <div id="gram"></div>
        <div id="earth"></div>

    <script src="src/script.js"></script>
